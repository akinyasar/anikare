<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 88 96" fill="none">
  <!-- Back polaroid frame — rotated 8° clockwise, peeking top-right -->
  <g transform="translate(50,44) rotate(8) translate(-26,-34)">
    <rect width="52" height="68" rx="4" fill="#f5e6ed" stroke="#6D1A3E" stroke-width="2.8"/>
    <line x1="3" y1="52" x2="49" y2="52" stroke="#6D1A3E" stroke-width="2"/>
  </g>
  <!-- Front polaroid frame — straight, main focus -->
  <g transform="translate(4, 10)">
    <rect width="52" height="68" rx="4" fill="white" stroke="#6D1A3E" stroke-width="2.8"/>
    <line x1="3" y1="52" x2="49" y2="52" stroke="#6D1A3E" stroke-width="2"/>
    <!-- Heart — large, centered in 52×52 photo area -->
    <path d="M26 37 C 26 37 10 27 10 17 C 10 10 15 7 19 7 C 22 7 25 9 26 12 C 28 9 30 7 33 7 C 37 7 43 10 43 17 C 43 27 26 37 26 37 Z" fill="#6D1A3E"/>
  </g>
</svg>
